[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-poc"
version = "0.1.0"
description = "Reproducible sparse orbital smoothing and evolving-drag benchmark"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<2", "scipy>=1.12,<1.16", "jax==0.6.2", "gtsam==4.2", "numpyro==0.19.0", "matplotlib>=3.8", "psutil>=5", "threadpoolctl>=3", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
gpu = ["jax[cuda12]==0.6.2"]

[project.scripts]
orbit-poc = "orbit_poc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
